<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Playback</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #presentation-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

    </style>
</head>
<body>
    <div id="presentation-container">
        <!-- Pages will be inserted here by JavaScript -->
    </div>



    <script>
        // Playback logic will be inserted here by JavaScript
    </script>
</body>
</html>
